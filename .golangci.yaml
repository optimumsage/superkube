version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      # Writes to the user's terminal/stdout have no useful recovery path;
      # everything else (closes, file writes, kubectl runs) stays checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: var-naming
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/optimumsage/superkube

issues:
  max-same-issues: 0
  max-issues-per-linter: 0
