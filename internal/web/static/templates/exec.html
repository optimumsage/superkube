{{define "exec.html"}}
<section class="page slide-up" x-data="ExecPage('{{.Namespace}}', '{{.Name}}', '{{.Container}}')">
  <header class="page-head">
    <div class="page-head-text">
      <p class="page-sub" style="margin: 0 0 6px;">
        <span class="pill pill-info">Exec</span>
        <span class="muted">Interactive shell — tab completion and resize work as in a real terminal.</span>
      </p>
      <h1 class="page-title mono" style="font-size: 22px; word-break: break-all;" x-text="ns + ' / ' + pod"></h1>
    </div>
  </header>
  <link rel="stylesheet" href="/static/css/xterm.min.css" />
  <script src="/static/js/xterm.min.js"></script>
  <script src="/static/js/xterm-addon-fit.min.js"></script>
  <div id="term" class="term" style="height:62vh"></div>
</section>
{{end}}
