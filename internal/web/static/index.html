<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>superkube</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <script defer src="/static/js/htmx.min.js"></script>
    <script defer src="/static/js/htmx-sse.min.js"></script>
    <!-- app.js must come BEFORE alpine.min.js: defer'd scripts run in
         document order, and Alpine evaluates x-data="App()" the moment it
         boots — so window.App must be defined first. -->
    <script defer src="/static/js/app.js"></script>
    <script defer src="/static/js/alpine.min.js"></script>
  </head>
  <body x-data="App()" x-init="init()">

    <!-- Inline SVG sprite. Pages reference icons via <svg><use href="#i-x"/></svg>.
         Keeping the sprite in index.html means every fragment can reuse without
         a network round trip. -->

        <symbol id="i-server" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><line x1="6" y1="7" x2="6.01" y2="7"/><line x1="6" y1="17" x2="6.01" y2="17"/></symbol>

        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
        <symbol id="i-terminal" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol>

        <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>

        <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></symbol>
        <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>

        <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>
        <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
        <symbol id="i-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
        <symbol id="i-activity" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></symbol>
        <symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
        <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
        <symbol id="i-message" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
        <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
        <symbol id="i-package" viewBox="0 0 24 24"><line x1="16.5" y1="9.4" x2="7.55" y2="4.24"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></symbol>
        <symbol id="i-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>

    </svg>

    <!-- Global HTMX loading bar; sits above every page. -->
    <div class="loading-bar" :class="htmxBusy && 'is-loading'"></div>

    <header class="topbar" role="banner">
      <div class="brand">
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </span>
        <span class="brand-name">superkube</span>
      </div>
      <div class="switcher">
        <div class="switcher-group">
          <span class="switcher-label">ctx</span>
          <select class="switcher-select" @change="switchContext($event.target.value)" x-model="ctx" :title="ctx">
            <template x-for="c in ctxOptions" :key="c">
              <option :value="c" x-text="shortCtx(c)"></option>
            </template>
          </select>
        </div>
        <div class="switcher-group">
          <span class="switcher-label">ns</span>
          <select class="switcher-select" @change="switchNamespace($event.target.value)" x-model="ns">
            <option value="">all</option>
            <template x-for="n in nsOptions" :key="n">
              <option :value="n" x-text="n"></option>
            </template>
          </select>
        </div>
      </div>
      <div class="topbar-right">
        <button class="iconbtn" @click="openPalette()" aria-label="Command palette" title="Command palette (⌘K)">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-command"/></svg>
          <span class="kbd">⌘K</span>
        </button>
        <button class="iconbtn" @click="toggleTheme()" aria-label="Toggle theme">
          <svg class="icon" aria-hidden="true" x-show="theme === 'dark'"><use href="#i-sun"/></svg>
          <svg class="icon" aria-hidden="true" x-show="theme !== 'dark'"><use href="#i-moon"/></svg>
        </button>
        <span class="version-badge" x-text="version || 'dev'"></span>
      </div>
    </header>

    <template x-if="banner.text">
      <div :class="'banner banner-' + (banner.kind || 'info')" x-text="banner.text"></div>
    </template>

    <div class="layout">
      <nav class="sidebar" aria-label="Primary">
        <div class="nav-section">Workspace</div>
        <a class="navlink" :class="path === '/' && 'active'" hx-get="/frag/dashboard" hx-target="#main" hx-push-url="/" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg></span>
          <span class="label">Dashboard</span>
        </a>
        <a class="navlink" :class="path.startsWith('/pods') && 'active'" hx-get="/frag/pods" hx-target="#main" hx-push-url="/pods" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-cube"/></svg></span>
          <span class="label">Pods</span>
        </a>
        <a class="navlink" :class="path === '/resources/deployments' && 'active'" hx-get="/frag/resources/deployments" hx-target="#main" hx-push-url="/resources/deployments" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-layers"/></svg></span>
          <span class="label">Deployments</span>
        </a>
        <a class="navlink" :class="path === '/resources/services' && 'active'" hx-get="/frag/resources/services" hx-target="#main" hx-push-url="/resources/services" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-network"/></svg></span>
          <span class="label">Services</span>
        </a>
        <a class="navlink" :class="path === '/resources/nodes' && 'active'" hx-get="/frag/resources/nodes" hx-target="#main" hx-push-url="/resources/nodes" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-server"/></svg></span>
          <span class="label">Nodes</span>
        </a>

        <div class="nav-section">Actions</div>
        <a class="navlink" :class="path === '/apply' && 'active'" hx-get="/frag/apply" hx-target="#main" hx-push-url="/apply" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg></span>
          <span class="label">Apply</span>
        </a>
        <a class="navlink" :class="path === '/logs/multi' && 'active'" hx-get="/frag/logs-multi" hx-target="#main" hx-push-url="/logs/multi" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-file-text"/></svg></span>
          <span class="label">Multi logs</span>
        </a>
        <a class="navlink" :class="path === '/ai' && 'active'" hx-get="/frag/ai" hx-target="#main" hx-push-url="/ai" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-sparkles"/></svg></span>
          <span class="label">Ask AI</span>
          <span class="nav-meta" x-text="ai || 'off'"></span>
        </a>
        <a class="navlink" :class="path === '/pf' && 'active'" hx-get="/frag/pf" hx-target="#main" hx-push-url="/pf" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-globe"/></svg></span>
          <span class="label">Port-forward</span>
        </a>

        <div class="nav-section">System</div>
        <a class="navlink" :class="path === '/audit' && 'active'" hx-get="/frag/audit" hx-target="#main" hx-push-url="/audit" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg></span>
          <span class="label">Audit</span>
        </a>
        <a class="navlink" :class="path === '/config' && 'active'" hx-get="/frag/config" hx-target="#main" hx-push-url="/config" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg></span>
          <span class="label">Config</span>
        </a>
        <a class="navlink" :class="path === '/settings' && 'active'" hx-get="/frag/settings" hx-target="#main" hx-push-url="/settings" hx-trigger="click">
          <span class="navicon"><svg class="icon" aria-hidden="true"><use href="#i-cog"/></svg></span>
          <span class="label">Settings</span>
        </a>
      </nav>
      <main id="main" class="main" tabindex="-1"></main>
    </div>

    <div id="portal"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
