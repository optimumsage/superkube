<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="superkube logo">
  <title>superkube</title>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4F8BFF"/>
      <stop offset="55%" stop-color="#2F62D9"/>
      <stop offset="100%" stop-color="#15307A"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="55%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF6A3D"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9DBFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7FA5FF" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Shield base: guardrail + superhero badge -->
  <path d="M128 12
           L222 44
           L222 132
           C222 184 182 222 128 244
           C74 222 34 184 34 132
           L34 44 Z"
        fill="url(#shield)"
        stroke="url(#rim)"
        stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Subtle highlight -->
  <path d="M128 12
           L222 44
           L222 132
           C222 184 182 222 128 244
           C74 222 34 184 34 132
           L34 44 Z"
        fill="url(#glow)"/>

  <!-- Kubernetes-inspired heptagonal helm -->
  <g transform="translate(128 130)">
    <!-- outer heptagon ring -->
    <polygon points="0,-74 64.5,-37 64.5,37 28,72 -28,72 -64.5,37 -64.5,-37"
             fill="none"
             stroke="#E8F0FF"
             stroke-width="3.5"
             stroke-linejoin="round"
             opacity="0.95"/>

    <!-- inner orbital hexagon (pods) -->
    <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22"
             fill="none"
             stroke="#E8F0FF"
             stroke-width="2"
             stroke-linejoin="round"
             opacity="0.55"/>

    <!-- spokes to vertices -->
    <g stroke="#E8F0FF" stroke-width="2" opacity="0.55" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-44"/>
      <line x1="0" y1="0" x2="38" y2="-22"/>
      <line x1="0" y1="0" x2="38" y2="22"/>
      <line x1="0" y1="0" x2="0" y2="44"/>
      <line x1="0" y1="0" x2="-38" y2="22"/>
      <line x1="0" y1="0" x2="-38" y2="-22"/>
    </g>

    <!-- pod nodes at inner vertices -->
    <g fill="#E8F0FF">
      <circle cx="0" cy="-44" r="3.2"/>
      <circle cx="38" cy="-22" r="3.2"/>
      <circle cx="38" cy="22" r="3.2"/>
      <circle cx="0" cy="44" r="3.2"/>
      <circle cx="-38" cy="22" r="3.2"/>
      <circle cx="-38" cy="-22" r="3.2"/>
    </g>

    <!-- AI spark: lightning bolt centered, the "super" -->
    <g filter="url(#soft)" opacity="0.55">
      <path d="M6 -34 L-14 6 L-2 6 L-8 34 L14 -8 L2 -8 Z"
            fill="url(#spark)"/>
    </g>
    <path d="M6 -34 L-14 6 L-2 6 L-8 34 L14 -8 L2 -8 Z"
          fill="url(#spark)"
          stroke="#7A2E0E"
          stroke-width="1"
          stroke-linejoin="round"/>
  </g>

  <!-- Terminal cursor mark (CLI nod) -->
  <g transform="translate(128 218)" opacity="0.92">
    <path d="M-18 -8 L-6 0 L-18 8" fill="none" stroke="#E8F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="0" y="-3" width="18" height="6" rx="1.5" fill="#E8F0FF"/>
  </g>
</svg>
